services:
  postgres:
    image: postgres:17
    container_name: agte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agte_dev
      POSTGRES_USER: agte_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - agte_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agte_dev -d agte_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  mongodb:
    image: mongo:8
    container_name: agte-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - agte_mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  agte_postgres_data:
  agte_mongodb_data: