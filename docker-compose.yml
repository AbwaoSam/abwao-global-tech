services:
  postgres:
    image: postgres:17
    container_name: agte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agte_dev
      POSTGRES_USER: agte_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - agte_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agte_dev -d agte_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agte_postgres_data: